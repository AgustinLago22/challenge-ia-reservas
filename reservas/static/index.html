<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reservas de laboratorio</title>
<style>
  :root {
    --fondo: #f6f7f9; --panel: #ffffff; --texto: #1d2330; --suave: #5b6476; --borde: #d9dde5;
    --acento: #2459c8; --ok: #17803d; --ok-fondo: #e6f4ea; --mal: #b42318; --mal-fondo: #fdecea;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fondo: #12151b; --panel: #1b2029; --texto: #e6e9ef; --suave: #9aa3b5; --borde: #2f3644;
      --acento: #7aa2f7; --ok: #6fcf8f; --ok-fondo: #15301f; --mal: #f28b82; --mal-fondo: #3a1c1a;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--fondo); color: var(--texto); font: 15px/1.45 system-ui, "Segoe UI", sans-serif; }
  header, main { max-width: 1040px; margin: 0 auto; padding: 0 16px; }
  header { padding-top: 24px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  header p { margin: 0; color: var(--suave); }
  main { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding-top: 16px; padding-bottom: 32px; }
  section { background: var(--panel); border: 1px solid var(--borde); border-radius: 10px; padding: 16px; }
  section.ancho { grid-column: 1 / -1; }
  h2 { font-size: 16px; margin: 0 0 12px; }
  form { display: grid; gap: 10px; }
  label { display: grid; gap: 4px; font-size: 13px; color: var(--suave); }
  input, select, button { font: inherit; color: inherit; }
  input, select { padding: 7px 9px; border: 1px solid var(--borde); border-radius: 6px; background: var(--fondo); }
  .fila { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  button { padding: 8px 14px; border: 0; border-radius: 6px; background: var(--acento); color: #fff; cursor: pointer; justify-self: start; }
  button.secundario { background: transparent; color: var(--acento); border: 1px solid var(--borde); }
  button.peligro { background: transparent; color: var(--mal); border: 1px solid var(--borde); padding: 4px 10px; }
  .mensaje { margin-top: 12px; padding: 10px 12px; border-radius: 6px; font-size: 14px; white-space: pre-wrap; }
  .mensaje:empty { display: none; }
  .mensaje.ok { background: var(--ok-fondo); color: var(--ok); }
  .mensaje.mal { background: var(--mal-fondo); color: var(--mal); }
  .codigo { font: 12px ui-monospace, Consolas, monospace; opacity: .8; }
  ul.disp { list-style: none; padding: 0; margin: 12px 0 0; display: grid; gap: 6px; }
  ul.disp li { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  .chip { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; }
  .chip.libre, .chip.ACTIVA { background: var(--ok-fondo); color: var(--ok); }
  .chip.ocupada { background: var(--mal-fondo); color: var(--mal); }
  .chip.CANCELADA { background: var(--fondo); color: var(--suave); border: 1px solid var(--borde); }
  .tabla { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--borde); white-space: nowrap; }
  th { color: var(--suave); font-weight: 600; font-size: 13px; }
  .barra { display: flex; gap: 10px; align-items: end; flex-wrap: wrap; margin-bottom: 8px; }
  .vacio { color: var(--suave); padding: 12px 0; }
  .mono { font-family: ui-monospace, Consolas, monospace; font-size: 13px; }
  @media (max-width: 760px) { main { grid-template-columns: 1fr; } .fila { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <h1>Reservas de equipos de laboratorio</h1>
  <p>Hora del servidor: <span id="ahora" class="mono">…</span> (UTC−3) · Base de datos: <span id="base" class="mono">…</span></p>
</header>

<main>
  <section>
    <h2>Consultar disponibilidad</h2>
    <form id="form-disp" novalidate>
      <label>Unidad <select name="unidad" id="disp-unidad"></select></label>
      <div class="fila">
        <label>Inicio <input type="datetime-local" name="inicio"></label>
        <label>Fin <input type="datetime-local" name="fin"></label>
      </div>
      <button type="submit">Consultar</button>
    </form>
    <ul class="disp" id="resultado-disp"></ul>
    <div class="mensaje" id="msg-disp"></div>
  </section>

  <section>
    <h2>Nueva reserva</h2>
    <form id="form-reserva" novalidate>
      <label>Unidad <select name="unidad" id="res-unidad"></select></label>
      <label>Solicitante (ficticio) <input type="text" name="solicitante" placeholder="Ana Prueba" autocomplete="off"></label>
      <div class="fila">
        <label>Inicio <input type="datetime-local" name="inicio"></label>
        <label>Fin <input type="datetime-local" name="fin"></label>
      </div>
      <button type="submit">Reservar</button>
    </form>
    <div class="mensaje" id="msg-reserva"></div>
  </section>

  <section class="ancho">
    <h2>Historial de reservas</h2>
    <div class="barra">
      <label>Estado
        <select id="filtro-estado">
          <option value="">Todas</option>
          <option value="ACTIVA">Activas</option>
          <option value="CANCELADA">Canceladas</option>
        </select>
      </label>
      <label>Unidad <select id="filtro-unidad"><option value="">Todas</option></select></label>
      <button type="button" class="secundario" id="refrescar">Actualizar</button>
    </div>
    <div class="tabla">
      <table>
        <thead><tr><th>#</th><th>Unidad</th><th>Estado</th><th>Inicio</th><th>Fin</th><th>Solicitante</th><th>Cancelada</th><th></th></tr></thead>
        <tbody id="tabla-reservas"></tbody>
      </table>
    </div>
    <div class="vacio" id="vacio" hidden>Sin reservas.</div>
    <div class="mensaje" id="msg-tabla"></div>
  </section>
</main>

<script>
// La página no decide nada: envía lo que se escribe y muestra lo que responde el servidor.
// Todo el texto se inserta con textContent (nunca HTML), así un solicitante como "<b>x</b>" se ve literal.
const $ = (id) => document.getElementById(id);

async function api(metodo, ruta, cuerpo) {
  const opciones = { method: metodo, headers: {} };
  if (cuerpo !== undefined) {
    opciones.headers["Content-Type"] = "application/json";
    opciones.body = JSON.stringify(cuerpo);
  }
  const respuesta = await fetch(ruta, opciones);
  return { estado: respuesta.status, datos: await respuesta.json() };
}

function el(etiqueta, texto, clase) {
  const nodo = document.createElement(etiqueta);
  if (texto !== undefined && texto !== null) nodo.textContent = texto;
  if (clase) nodo.className = clase;
  return nodo;
}

function mostrar(idMensaje, { estado, datos }, textoOk) {
  const caja = $(idMensaje);
  const ok = estado < 400;
  caja.className = "mensaje " + (ok ? "ok" : "mal");
  caja.textContent = "";
  caja.append(el("span", ok ? textoOk : datos.error), el("div", "HTTP " + estado, "codigo"));
}

function cargarUnidades(unidades) {
  for (const id of ["disp-unidad", "res-unidad", "filtro-unidad"]) {
    const select = $(id);
    if (id === "disp-unidad") select.append(new Option("Todas las unidades", "todas"));
    for (const u of unidades) select.append(new Option(u.id + " — " + u.equipo, u.id));
  }
}

function fechaMas(texto, dias, hora) {
  const d = new Date(texto + ":00");
  d.setDate(d.getDate() + dias);
  const p = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${hora}`;
}

function valores(form) {
  return Object.fromEntries(new FormData(form).entries());
}

async function refrescarTabla() {
  const q = new URLSearchParams({ estado: $("filtro-estado").value, unidad: $("filtro-unidad").value });
  const r = await api("GET", "/api/reservas?" + q);
  const cuerpo = $("tabla-reservas");
  cuerpo.textContent = "";
  if (r.estado >= 400) return mostrar("msg-tabla", r);
  $("msg-tabla").textContent = "";
  $("vacio").hidden = r.datos.length > 0;
  for (const res of r.datos) {
    const fila = document.createElement("tr");
    const estado = el("td");
    estado.append(el("span", res.estado, "chip " + res.estado));
    const accion = el("td");
    if (res.estado === "ACTIVA") {
      const boton = el("button", "Cancelar", "peligro");
      boton.type = "button";
      boton.addEventListener("click", async () => {
        const c = await api("POST", `/api/reservas/${res.id}/cancelar`, {});
        mostrar("msg-tabla", c, `Reserva #${res.id} cancelada. El registro se conserva y el horario queda libre.`);
        refrescarTabla();
      });
      accion.append(boton);
    }
    fila.append(el("td", "#" + res.id, "mono"), el("td", res.unidad, "mono"), estado,
      el("td", res.inicio, "mono"), el("td", res.fin, "mono"), el("td", res.solicitante),
      el("td", res.cancelada_en || "", "mono"), accion);
    cuerpo.append(fila);
  }
}

$("form-disp").addEventListener("submit", async (e) => {
  e.preventDefault();
  const r = await api("GET", "/api/disponibilidad?" + new URLSearchParams(valores(e.target)));
  const lista = $("resultado-disp");
  lista.textContent = "";
  $("msg-disp").textContent = "";
  if (r.estado >= 400) return mostrar("msg-disp", r);
  for (const d of r.datos) {
    const item = el("li");
    item.append(el("span", d.unidad, "mono"), el("span", d.disponible ? "DISPONIBLE" : "OCUPADA", "chip " + (d.disponible ? "libre" : "ocupada")));
    for (const c of d.conflictos) item.append(el("span", `conflicto con #${c.id} ${c.inicio} → ${c.fin} (${c.solicitante})`, "codigo"));
    lista.append(item);
  }
});

$("form-reserva").addEventListener("submit", async (e) => {
  e.preventDefault();
  const r = await api("POST", "/api/reservas", valores(e.target));
  mostrar("msg-reserva", r, r.estado < 400 ? `Reserva #${r.datos.id} creada: ${r.datos.unidad} ${r.datos.inicio} → ${r.datos.fin}` : "");
  refrescarTabla();
});

$("filtro-estado").addEventListener("change", refrescarTabla);
$("filtro-unidad").addEventListener("change", refrescarTabla);
$("refrescar").addEventListener("click", refrescarTabla);

(async () => {
  const [info, unidades] = await Promise.all([api("GET", "/api/info"), api("GET", "/api/unidades")]);
  $("ahora").textContent = info.datos.ahora;
  $("base").textContent = info.datos.base;
  cargarUnidades(unidades.datos);
  // Valores iniciales: mañana de 10:00 a 11:00, según la hora del servidor.
  for (const form of [$("form-disp"), $("form-reserva")]) {
    form.inicio.value = fechaMas(info.datos.ahora, 1, "10:00");
    form.fin.value = fechaMas(info.datos.ahora, 1, "11:00");
  }
  refrescarTabla();
})();
</script>
</body>
</html>
